id = "zembed"
name = "Zembed"
description = "Embedded development for Zed: debug microcontrollers with probe-rs (PlatformIO planned)."
version = "0.1.0"
schema_version = 1
authors = ["Alban Petit"]
repository = "https://github.com/albanpetit/zembed"

# One entry per debug adapter. The key is the name used in `.zed/debug.json`
# ("adapter": "probe-rs"). Future adapters (e.g. PlatformIO) get their own
# entry here and their own module in `src/adapters/`.
[debug_adapters.probe-rs]
schema_path = "debug_adapter_schemas/probe-rs.json"
