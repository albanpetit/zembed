id = "zembed"
name = "Zembed"
description = "Embedded development for Zed: debug Rust and PlatformIO firmware on microcontrollers with probe-rs."
version = "0.2.0"
schema_version = 1
authors = ["Alban Petit"]
repository = "https://github.com/albanpetit/zembed"

# One entry per debug adapter. The key is the name used in `.zed/debug.json`
# ("adapter": "probe-rs"). Future adapters (e.g. a GDB-based one) get their
# own entry here and their own module in `src/adapters/`.
[debug_adapters.probe-rs]
schema_path = "debug_adapter_schemas/probe-rs.json"
